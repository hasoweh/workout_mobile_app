<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1013" />
    <meta name="description" content="Offline workout logger with progress tracking" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Workout Tracker</title>
  </head>
  <body>
    <main id="app"></main>
    <nav class="tabbar">
      <a href="#/log" data-route="log">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11" /></svg>
        Log
      </a>
      <a href="#/program" data-route="program">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" /><path d="M3.5 10h17M8 3v4M16 3v4" /></svg>
        Program
      </a>
      <a href="#/progress" data-route="progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5h17M5 16l4.5-5 4 3.5L20 7" /><path d="M15.5 7H20v4.5" /></svg>
        Progress
      </a>
      <a href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2.2" /><circle cx="10" cy="17" r="2.2" /></svg>
        Settings
      </a>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
